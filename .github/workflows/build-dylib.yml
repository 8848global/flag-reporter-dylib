name: Build iOS dylib

on:
  push:
    paths:
      - 'FlagReporter.m'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Build FlagReporter.dylib
      run: |
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "SDK: $SDK_PATH"
        
        clang -shared -fobjc-arc \
            -target arm64-apple-ios13.0 \
            -isysroot "$SDK_PATH" \
            -framework Foundation \
            -framework UIKit \
            -o FlagReporter.dylib \
            FlagReporter.m
        
        echo "✓ 编译完成"
        file FlagReporter.dylib
        ls -lh FlagReporter.dylib
    
    - name: Upload dylib artifact
      uses: actions/upload-artifact@v3
      with:
        name: FlagReporter-dylib
        path: FlagReporter.dylib
        retention-days: 30
